# Local development overrides — shared Mongo instance on this machine.
spring.data.mongodb.uri=mongodb://varun:qwsxza%401234@localhost:27017/real_estate_uprera?authSource=admin

# Public R2.dev bucket URL — local dev doesn't have the custom CDN domain
# (media.acreinfotech.com, used in prod) fronting it.
app.cdn-base-url=https://pub-9e15b4f51c5d4efbaf348e497020fd0c.r2.dev

app.cors-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4000}

# On-demand ISR notification target — see FrontendRevalidator. Must match
# real_estate_frontend's REVALIDATE_SECRET (its .env.local). Blank/unset in
# either app just skips revalidation, so this is safe to leave out if your
# local frontend isn't running.
app.frontend-url=${FRONTEND_URL:http://127.0.0.1:3000}
app.revalidate-secret=${REVALIDATE_SECRET:}

# Social auto-posting — see BufferClient / SocialPostController. All unset
# by default: the Publisher step's social-post call just reports "not
# configured" and falls back to surfacing captions for manual posting,
# nothing breaks. Fill in once you have a Buffer personal access token
# (https://publish.buffer.com/settings/api) and have connected Instagram,
# Facebook and LinkedIn channels there (free plan caps at 3 channels — X
# deliberately excluded, see SOCIAL_CONTENT_PIPELINE.md §8).
app.buffer-access-token=${BUFFER_ACCESS_TOKEN:}
app.buffer-channel-ids.instagram=${BUFFER_CHANNEL_ID_INSTAGRAM:}
app.buffer-channel-ids.facebook=${BUFFER_CHANNEL_ID_FACEBOOK:}
app.buffer-channel-ids.linkedin=${BUFFER_CHANNEL_ID_LINKEDIN:}

# Stock photo for Pipeline B (topic-digest) social posts — see
# UnsplashClient. Unset skips the image, never blocks posting. Free key:
# https://unsplash.com/developers (create an app, use its Access Key).
app.unsplash-access-key=${UNSPLASH_ACCESS_KEY:}

logging.level.org.springframework.data.mongodb.core.MongoTemplate=${MONGO_LOG_LEVEL:DEBUG}
logging.level.com.uprera.estates=DEBUG
