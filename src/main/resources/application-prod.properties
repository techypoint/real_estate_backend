# Production overrides — the app runs on the same box as Mongo (202.66.173.8),
# so it connects over loopback rather than the LAN address the old shared
# server used.
spring.data.mongodb.uri=mongodb://varun:qwsxza%401234@127.0.0.1:27017/real_estate_uprera?authSource=admin

# Base URL of the CDN in front of the R2 bucket. Every media_ref.url and
# ProjectDocument.url in Mongo is a bare object key; CdnUrlResolver prefixes
# this at read time so switching storage providers is one property change,
# never a rewrite of stored content. Literal value — no .env / env var
# indirection, per the local-profile bug this caused (see application-local.properties).
app.cdn-base-url=https://media.acreinfotech.com

# No localhost fallback here — CORS must be explicit in prod, and a missing
# value should fail startup rather than silently default to a dev origin.
app.cors-origins=${CORS_ORIGINS}

logging.level.org.springframework.data.mongodb.core.MongoTemplate=${MONGO_LOG_LEVEL:WARN}
logging.level.com.uprera.estates=INFO
