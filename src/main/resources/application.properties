# Shared config for every profile. Profile-specific files
# (application-local.properties, application-prod.properties) override
# individual keys; they never redefine the whole file.
spring.application.name=real-estate-backend

# Defaults to "local" so `mvn spring-boot:run` works with no extra flags on a
# dev machine. Prod deploys must set SPRING_PROFILES_ACTIVE=prod explicitly.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# spring.data.mongodb.uri is set per-profile (application-local.properties /
# application-prod.properties) — local and prod point at different hosts.
# indexes are owned by the importer scripts
spring.data.mongodb.auto-index-creation=false

spring.jackson.default-property-inclusion=non_null
# Emit "2026-08-08T10:41:19.319Z", not "...+00:00". Both are valid ISO-8601,
# but the frontend and any cached responses were built against the Z form.
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

server.port=${SERVER_PORT:8888}
# Spring's defaults (include-message=never, include-binding-errors=never)
# hide every error body's reason — including ResponseStatusException
# messages we deliberately wrote (e.g. "Project not found") and bean-
# validation messages (e.g. "must not be blank"). Confirmed 2026-09-27: a
# caller got an opaque 400 for a real validation failure and, with no way
# to see why, wrongly concluded the endpoint didn't exist. This service has
# no auth and no external exposure (see CdnUrlResolver's class comment),
# so there's no confidentiality reason to keep hiding it. Stack traces stay
# off (include-stacktrace defaults to never) — only human-readable reasons
# turn on.
server.error.include-message=always
server.error.include-binding-errors=always
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=1024

# app.cdn-base-url is set per-profile (application-local.properties /
# application-prod.properties) — it is deliberately NOT defined here too:
# defining it in both the shared file and a profile file was observed to
# resolve to the shared file's value even though the profile file should
# win, so each profile now owns it outright with no shared default to
# conflict with.
