# Reverse proxy for the Java API — fronts the Spring Boot app on 127.0.0.1:8888
# (see application-prod.properties / run.sh). HTTP only for now; once TLS
# certs are ready, run `certbot --nginx -d api.acreinfotech.com` and it will
# rewrite this file to add the 443 server block + redirect.

server {
    listen 80;
    listen [::]:80;
    server_name api.acreinfotech.com;

    access_log /var/log/nginx/api.acreinfotech.com.access.log;
    error_log  /var/log/nginx/api.acreinfotech.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Let the backend's own Keep-Alive handling apply, not nginx's default
        # of forcing "Connection: close" upstream.
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
